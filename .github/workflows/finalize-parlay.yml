name: ApeLevel x PARLAY Automatic Snapshot Processor

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
  push:
    paths:
      - .github/workflows/finalize-parlay.yml

permissions:
  contents: read

concurrency:
  group: apelevel-parlay-snapshot
  cancel-in-progress: false

jobs:
  finalize-expired-proposals:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reconstruct expired PARLAY proposals and finalize verified results
        env:
          APELEVEL_PARLAY_CLOUDFLARE_TOKEN: ${{ secrets.APELEVEL_PARLAY_CLOUDFLARE_TOKEN }}
        run: node scripts/snapshot-processor.mjs
