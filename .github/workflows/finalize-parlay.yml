name: ApeLevel x PARLAY Snapshot Processor

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/finalize-parlay.yml

concurrency:
  group: apelevel-parlay-snapshot
  cancel-in-progress: false

jobs:
  finalize-proposal-4:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Reconstruct Proposal 4 and finalize results
        env:
          APELEVEL_PARLAY_CLOUDFLARE_TOKEN: ${{ secrets.APELEVEL_PARLAY_CLOUDFLARE_TOKEN }}
        run: node scripts/snapshot-processor.mjs
